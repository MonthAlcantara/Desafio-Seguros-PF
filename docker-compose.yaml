  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9411:9411"
    # Define o healthcheck para o Zipkin.
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --tries=1 --timeout=2 --spider http://localhost:9411 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Base de Dados PostgreSQL
  postgres:
    image: postgres:16
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acme-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Painel de administração para o PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: acme-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - acme-network
    depends_on:
      - postgres

  # WireMock para simular a API de fraude
  wiremock:
    image: wiremock/wiremock:2.35.0
    container_name: acme-wiremock
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--global-response-templating"]
    networks:
      - acme-network

  # Zookeeper, necessário para o Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: acme-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - acme-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: acme-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - acme-network

  # AKHQ, interface para gerenciar o Kafka
  akhq:
    image: tchiotludo/akhq
    container_name: acme-akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-host:
              properties:
                bootstrap.servers: "kafka:29092"
    ports:
      - "8082:8080"
    depends_on:
      - kafka
    networks:
      - acme-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  acme-network:
    driver: bridge