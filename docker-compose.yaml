version: '3.8'

services:
  # Base de Dados PostgreSQL
  postgres:
    image: postgres:16
    container_name: acme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: acme_user
      POSTGRES_PASSWORD: acme_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acme-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Painel de administração para o PostgreSQL
  pgadmin:
    image: dpage/pgadmin4
    container_name: acme-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - acme-network
    depends_on:
      - postgres

  # WireMock para simular a API de fraude
  wiremock:
    image: wiremock/wiremock:2.35.0
    container_name: acme-wiremock
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: ["--global-response-templating"]
    networks:
      - acme-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/__admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Zipkin para rastreamento
  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --timeout=2 --spider http://localhost:9411 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - acme-network

  # Zookeeper necessário para Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: acme-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - acme-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'ruok' | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: acme-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - acme-network
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 30 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Criador de tópicos Kafka (executa antes do AKHQ)
  kafka-topics-creator:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-topics-creator
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Creating Kafka topics...' &&
      kafka-topics --create --topic order-status-events --bootstrap-server kafka:29092 --replication-factor 1 --partitions 1 &&
      kafka-topics --create --topic payments-events --bootstrap-server kafka:29092 --replication-factor 1 --partitions 1 &&
      kafka-topics --create --topic insurance-subscriptions-events --bootstrap-server kafka:29092 --replication-factor 1 --partitions 1 &&
      echo 'Topics created successfully!'"
    networks:
      - acme-network

  # AKHQ para gerenciar Kafka
  akhq:
    image: tchiotludo/akhq:latest
    container_name: acme-akhq
    ports:
      - "8082:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-host:
              properties:
                bootstrap.servers: "kafka:29092"
                security.protocol: "PLAINTEXT"
    depends_on:
      kafka-topics-creator:
        condition: service_completed_successfully
    networks:
      - acme-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  acme-network:
    driver: bridge
